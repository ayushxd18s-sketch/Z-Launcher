name: Build & Release APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep "launcher_version_name" ZalithLauncher/gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build Release APKs
        run: ./gradlew :ZalithLauncher:assembleRelease

      - name: Rename APKs
        run: |
          VERSION=${{ steps.version.outputs.version }}
          APK_DIR="ZalithLauncher/build/outputs/apk/release"
          for APK in "$APK_DIR"/*.apk; do
            FILENAME=$(basename "$APK")
            if [[ "$FILENAME" == *"arm64-v8a"* ]]; then
              mv "$APK" "Z-Launcher-${VERSION}-arm64-v8a.apk"
            elif [[ "$FILENAME" == *"armeabi-v7a"* ]]; then
              mv "$APK" "Z-Launcher-${VERSION}-armeabi-v7a.apk"
            elif [[ "$FILENAME" == *"x86_64"* ]]; then
              mv "$APK" "Z-Launcher-${VERSION}-x86_64.apk"
            elif [[ "$FILENAME" == *"x86"* ]]; then
              mv "$APK" "Z-Launcher-${VERSION}-x86.apk"
            elif [[ "$FILENAME" == *"universal"* ]]; then
              mv "$APK" "Z-Launcher-${VERSION}.apk"
            fi
          done
          ls -la Z-Launcher-*.apk

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Z-Launcher-*.apk
          name: Z-Launcher ${{ steps.version.outputs.version }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
